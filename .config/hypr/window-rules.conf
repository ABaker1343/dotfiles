windowrule {
	name = steam
	match:class = ^(steam)$

	workspace = $steamWorkspace silent
}

windowrule {
	name = games
	match:class = ^(steam_app_\d+|gamescope|steam_proton)
	# match:content = game

	workspace = $gamingWorkspace silent
	immediate = on
    fullscreen = on
}

windowrule {
	name = spotify
	match:class = ^(spotify|Spotify)$

	workspace = $spotifyWorkspace
}

windowrule {
	name = discord
	match:class = ^discord$

	workspace = $discordWorkspace
}

windowrule {
    name = mpv
    match:class = ^mpv$

    float = on
    size = (monitor_w*0.8) (monitor_h*0.8)
    center = on
}

windowrule {
	name = polkit
	match:class = ^org.kde.polkit-kde-authentication-agent-1$ 

	float = on
	size = 30% 30%
	center = on
}


windowrule {
	name = guiaudio
	match:class = ^(pavucontrol|org.pulseaudio.pavucontrol)$ 

	float = on
	size = 70% 70%
	center = on
}

windowrule {
	name = bluetooth
	match:class = ^(pavucontrol|org.pulseaudio.pavucontrol)$ 

	float = on
	size = 60% 60%
	center = on
}

windowrule {
	name = sysmonitor
	match:class = (kitty) 
	match:title = (btop|htop)

	float = on
	size = 60% 60%
	center = on
}

windowrule {
	name = xclock
	match:class = ^XClock$

	float = on
	center = on
}

windowrule {
	name = desktop-portal
	match:class = class:^xdg-desktop-portal-gtk$}

	float = on
	center = on
	size = 60% 80%
}

windowrule {
	name = rofi
	match:class = ^rofi$

	monitor = $monitor1
}

windowrule {
    name = password-manager
    match:title = ^Extension:
    match:class = librewolf
    
    float = on
    center = on
}
